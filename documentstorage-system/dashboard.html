<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e63946">

  <!-- Shared Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<div id="network-status"></div>

<div class="top-bar">
  <h2>Dashboard</h2>

  <div class="top-buttons">
    <button class="secondary-button" onclick="goToAdminPanel()">Admin Panel</button>
    <button class="danger-button" onclick="logout()">Logout</button>
  </div>
</div>

<div id="systemVersion" style="
  margin-bottom: 15px;
  color: #aaa;
  font-size: 12px;
">
  System Version: Local PWA v1.1
</div>

<h3>Create / Edit Document</h3>

<input type="text" id="titleInput" placeholder="Document title...">

<select id="categoryInput">
  <option value="General">General</option>
  <option value="Receipt">Receipt</option>
  <option value="Contract">Contract</option>
  <option value="Photo">Photo</option>
  <option value="Note">Note</option>
  <option value="Important">Important</option>
</select>

<textarea id="docInput" placeholder="Write your document..."></textarea>

<div id="dropZone">
  Drag & Drop File Here or Click
</div>

<input type="file" id="fileInput" style="
  opacity:0;
  position:absolute;
  width:1px;
  height:1px;
">

<button id="saveButton" onclick="saveDoc()">Save Document</button>
<button id="cancelEditButton" class="secondary-button" onclick="cancelEdit()" style="display:none;">Cancel Edit</button>

<h3>Find Documents</h3>

<input type="text" id="searchInput" placeholder="Search documents..." oninput="filterDocs()">

<select id="categoryFilter" onchange="filterDocs()">
  <option value="All">All Categories</option>
  <option value="General">General</option>
  <option value="Receipt">Receipt</option>
  <option value="Contract">Contract</option>
  <option value="Photo">Photo</option>
  <option value="Note">Note</option>
  <option value="Important">Important</option>
</select>

<select id="sortFilter" onchange="filterDocs()">
  <option value="newest">Newest First</option>
  <option value="oldest">Oldest First</option>
  <option value="updated">Recently Updated</option>
  <option value="category">Category A-Z</option>
  <option value="title">Title A-Z</option>
</select>

<button class="secondary-button" onclick="clearFilters()">Clear Filters</button>
<button class="secondary-button" onclick="exportBackup()">Export Backup</button>

<h3>Saved Documents</h3>

<div id="docCount" style="
  margin-top: 12px;
  color: #00ff88;
  font-size: 13px;
">
  Loading document count...
</div>

<div id="documents"></div>

<div id="debug-box">Checking session...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const client = getSupabaseClient();

/* ========= FILE SELECTION ========= */
const titleInput = document.getElementById("titleInput");
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const saveButton = document.getElementById("saveButton");
const cancelEditButton = document.getElementById("cancelEditButton");
const searchInput = document.getElementById("searchInput");
const categoryInput = document.getElementById("categoryInput");
const categoryFilter = document.getElementById("categoryFilter");
const sortFilter = document.getElementById("sortFilter");
const docCount = document.getElementById("docCount");

let selectedFile = null;
let editingDocId = null;
let allDocuments = [];

/* ========= APP TIMEZONE ========= */
const APP_TIMEZONE = "America/Tijuana";

/* ========= NETWORK STATUS ========= */
function showConnectionWarning(reason) {
  const statusBox = document.getElementById("network-status");

  statusBox.style.display = "block";
  statusBox.innerText =
`OFFLINE / CONNECTION / SESSION ISSUE
------------------------
${reason}

This page may still load because of PWA caching, but saving, uploading, editing, deleting, loading documents, and Self-Snitch database logging require an active internet connection and a valid Supabase session.`;
}

function hideConnectionWarning() {
  const statusBox = document.getElementById("network-status");

  statusBox.style.display = "none";
  statusBox.innerText = "";
}

function checkBrowserNetworkStatus() {
  if (!navigator.onLine) {
    showConnectionWarning("Your browser reports that you are offline.");
  }
}

function isConnectionOrSessionIssue(error) {
  const message = (error.message || "").toLowerCase();

  return (
    message.includes("failed to fetch") ||
    message.includes("networkerror") ||
    message.includes("network request failed") ||
    message.includes("network") ||
    message.includes("fetch") ||
    message.includes("session") ||
    message.includes("not logged in") ||
    message.includes("auth") ||
    message.includes("supabase library is not loaded")
  );
}

window.addEventListener("online", () => {
  hideConnectionWarning();
});

window.addEventListener("offline", () => {
  showConnectionWarning("Your browser reports that you are offline.");
});

/* ========= DEBUG SYSTEM ========= */
function reportError(error, context) {
  console.error(error);

  if (isConnectionOrSessionIssue(error)) {
    showConnectionWarning("The app could not confirm the Supabase connection/session. This often happens when internet is unavailable or the login session cannot be verified.");
  }

  logError({
    message: error.message,
    source: "dashboard.html",
    context: context,
    line: null,
    column: null
  });

  let fixText = `
Possible Fix:
- Check login session
- Check Supabase setup
- Check internet
`;

  if (isConnectionOrSessionIssue(error)) {
    fixText = `
Possible Fix:
- Reconnect Wi-Fi / internet
- Refresh the page after reconnecting
- Log in again if the session expired
- Check if Supabase is reachable
`;
  }

  document.getElementById("debug-box").innerText = `
ERROR DETECTED
------------------------
Where: ${context}
Message: ${error.message}
${fixText}`;
}

function reportSuccess(message) {
  hideConnectionWarning();
  document.getElementById("debug-box").innerText = message;
}

/* ========= SELF-SNITCH ERROR LOGGING ========= */
async function logError(errorInfo) {
  const newLog = {
    message: errorInfo.message || "Unknown error",
    source: errorInfo.source || "unknown",
    line: errorInfo.line || null,
    column: errorInfo.column || null,
    context: errorInfo.context || "No context provided",
    time: new Date().toISOString()
  };

  try {
    const existingLogs = JSON.parse(localStorage.getItem("errorLogs")) || [];
    existingLogs.push(newLog);
    localStorage.setItem("errorLogs", JSON.stringify(existingLogs));
  } catch (localError) {
    console.error("Local error logging failed:", localError);
  }

  try {
    if (!navigator.onLine) {
      console.warn("Offline. Error saved locally only.");
      return;
    }

    const { data: userData } = await client.auth.getUser();

    if (!userData || !userData.user) {
      console.warn("No logged-in user found. Error saved locally only.");
      return;
    }

    const { error: insertError } = await client
      .from("error_logs")
      .insert([{
        user_id: userData.user.id,
        message: newLog.message,
        source: newLog.source,
        context: newLog.context,
        line_number: newLog.line,
        column_number: newLog.column
      }]);

    if (insertError) {
      console.error("Supabase error logging failed:", insertError);
    }

  } catch (dbError) {
    console.error("Database error logger failed:", dbError);
  }
}

window.addEventListener("error", (event) => {
  logError({
    message: event.message,
    source: event.filename || "unknown",
    line: event.lineno || null,
    column: event.colno || null,
    context: "Global JavaScript Error"
  });
});

window.addEventListener("unhandledrejection", (event) => {
  logError({
    message: event.reason?.message || "Unhandled promise rejection",
    source: "Promise",
    line: null,
    column: null,
    context: "Unhandled Promise Rejection"
  });
});

/* ========= DATE FORMATTER ========= */
function normalizeTimestamp(dateValue) {
  if (!dateValue) {
    return null;
  }

  const value = String(dateValue);

  if (value.endsWith("Z") || value.includes("+") || value.match(/-\d\d:\d\d$/)) {
    return value;
  }

  return value + "Z";
}

function getTimeValue(dateValue) {
  const normalizedValue = normalizeTimestamp(dateValue);

  if (!normalizedValue) {
    return 0;
  }

  const date = new Date(normalizedValue);

  if (isNaN(date.getTime())) {
    return 0;
  }

  return date.getTime();
}

function getLatestActivityTime(doc) {
  return getTimeValue(doc.updated_at || doc.created_at);
}

function formatDate(dateValue) {
  if (!dateValue) {
    return "No date recorded";
  }

  const normalizedValue = normalizeTimestamp(dateValue);
  const date = new Date(normalizedValue);

  if (isNaN(date.getTime())) {
    return "Invalid date";
  }

  return new Intl.DateTimeFormat("en-US", {
    timeZone: APP_TIMEZONE,
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "numeric",
    minute: "2-digit",
    hour12: true
  }).format(date) + " (Baja California time)";
}

/* ========= FILE TYPE HELPER ========= */
function getFileTypeLabel(fileUrl) {
  if (!fileUrl) {
    return "No file";
  }

  const cleanUrl = fileUrl.split("?")[0].toLowerCase();

  if (
    cleanUrl.endsWith(".jpg") ||
    cleanUrl.endsWith(".jpeg") ||
    cleanUrl.endsWith(".png") ||
    cleanUrl.endsWith(".gif") ||
    cleanUrl.endsWith(".webp")
  ) {
    return "Image";
  }

  if (cleanUrl.endsWith(".pdf")) {
    return "PDF";
  }

  if (
    cleanUrl.endsWith(".doc") ||
    cleanUrl.endsWith(".docx")
  ) {
    return "Word Document";
  }

  if (
    cleanUrl.endsWith(".xls") ||
    cleanUrl.endsWith(".xlsx") ||
    cleanUrl.endsWith(".csv")
  ) {
    return "Spreadsheet";
  }

  if (
    cleanUrl.endsWith(".txt") ||
    cleanUrl.endsWith(".md")
  ) {
    return "Text File";
  }

  return "File";
}

function isImageFile(fileUrl) {
  return getFileTypeLabel(fileUrl) === "Image";
}

/* ========= STORAGE PATH HELPER ========= */
function getStoragePathFromPublicUrl(fileUrl) {
  if (!fileUrl) {
    return null;
  }

  try {
    const url = new URL(fileUrl);
    const marker = "/storage/v1/object/public/files/";
    const index = url.pathname.indexOf(marker);

    if (index === -1) {
      return null;
    }

    const path = url.pathname.substring(index + marker.length);

    if (!path) {
      return null;
    }

    return decodeURIComponent(path);

  } catch (error) {
    console.error("Could not extract storage path:", error);
    return null;
  }
}

/* ========= SORT HELPER ========= */
function sortDocuments(docs) {
  const sortValue = sortFilter.value;

  const sortedDocs = docs.slice();

  if (sortValue === "oldest") {
    sortedDocs.sort((a, b) => {
      return getTimeValue(a.created_at) - getTimeValue(b.created_at);
    });

    return sortedDocs;
  }

  if (sortValue === "updated") {
    sortedDocs.sort((a, b) => {
      return getLatestActivityTime(b) - getLatestActivityTime(a);
    });

    return sortedDocs;
  }

  if (sortValue === "category") {
    sortedDocs.sort((a, b) => {
      const categoryA = (a.category || "General").toLowerCase();
      const categoryB = (b.category || "General").toLowerCase();

      if (categoryA < categoryB) return -1;
      if (categoryA > categoryB) return 1;

      return getLatestActivityTime(b) - getLatestActivityTime(a);
    });

    return sortedDocs;
  }

  if (sortValue === "title") {
    sortedDocs.sort((a, b) => {
      const titleA = (a.title || "Untitled Document").toLowerCase();
      const titleB = (b.title || "Untitled Document").toLowerCase();

      if (titleA < titleB) return -1;
      if (titleA > titleB) return 1;

      return getLatestActivityTime(b) - getLatestActivityTime(a);
    });

    return sortedDocs;
  }

  sortedDocs.sort((a, b) => {
    return getTimeValue(b.created_at) - getTimeValue(a.created_at);
  });

  return sortedDocs;
}

/* ========= CLICK TO SELECT FILE ========= */
dropZone.addEventListener("click", () => {
  fileInput.value = "";
  fileInput.click();
});

fileInput.addEventListener("change", (event) => {
  selectedFile = event.target.files[0];
  dropZone.innerText = selectedFile ? selectedFile.name : "Drag & Drop File Here or Click";
});

/* ========= DRAG AND DROP FILE ========= */
dropZone.addEventListener("dragover", (event) => {
  event.preventDefault();
  dropZone.style.borderColor = "#e63946";
});

dropZone.addEventListener("dragleave", () => {
  dropZone.style.borderColor = "#555";
});

dropZone.addEventListener("drop", (event) => {
  event.preventDefault();
  dropZone.style.borderColor = "#555";

  selectedFile = event.dataTransfer.files[0];

  if (selectedFile) {
    dropZone.innerText = selectedFile.name;
  }
});

/* ========= CHECK LOGIN ========= */
async function checkUser() {
  try {
    checkBrowserNetworkStatus();

    const { data, error } = await client.auth.getUser();

    if (error || !data.user) {
      throw new Error("User not logged in");
    }

    reportSuccess("User verified. Ready.");

    loadDocs();

  } catch (error) {
    reportError(error, "Session Check");

    if (!isConnectionOrSessionIssue(error)) {
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);
    }
  }
}

/* ========= UPLOAD FILE HELPER ========= */
async function uploadSelectedFile(userId, file) {
  const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const fileName = userId + "/" + Date.now() + "_" + safeFileName;

  const { error: uploadError } = await client.storage
    .from("files")
    .upload(fileName, file);

  if (uploadError) throw uploadError;

  const { data: urlData } = client.storage
    .from("files")
    .getPublicUrl(fileName);

  return urlData.publicUrl;
}

/* ========= DELETE FILE HELPER ========= */
async function deleteStorageFile(fileUrl) {
  const storagePath = getStoragePathFromPublicUrl(fileUrl);

  if (!storagePath) {
    console.warn("No storage path found for file URL. Skipping file cleanup.");
    return;
  }

  const { error } = await client.storage
    .from("files")
    .remove([storagePath]);

  if (error) {
    throw error;
  }
}

/* ========= SAVE OR UPDATE DOCUMENT ========= */
async function saveDoc() {
  if (editingDocId) {
    updateDoc();
    return;
  }

  try {
    const title = titleInput.value.trim() || "Untitled Document";
    const text = document.getElementById("docInput").value;
    const file = selectedFile;
    const category = categoryInput.value || "General";

    if (!title && !text && !file) {
      throw new Error("Nothing to save");
    }

    if (!text && !file && title === "Untitled Document") {
      throw new Error("Nothing to save");
    }

    if (!navigator.onLine) {
      showConnectionWarning("Your browser reports that you are offline.");
      throw new Error("Cannot save while offline. Saving requires internet.");
    }

    const { data: userData, error: userError } = await client.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("User session not found");
    }

    let file_url = null;

    if (file) {
      file_url = await uploadSelectedFile(userData.user.id, file);
    }

    const { error } = await client
      .from("documents")
      .insert([{
        title: title,
        content: text,
        user_id: userData.user.id,
        file_url: file_url,
        category: category
      }]);

    if (error) throw error;

    reportSuccess("Saved successfully");

    resetForm();

    loadDocs();

  } catch (error) {
    reportError(error, "Saving Document");
  }
}

/* ========= START EDIT ========= */
function startEdit(id, title, content, category) {
  editingDocId = id;

  titleInput.value = title || "Untitled Document";
  document.getElementById("docInput").value = content || "";
  categoryInput.value = category || "General";

  selectedFile = null;
  fileInput.value = "";
  dropZone.innerText = "Optional: Drag & Drop New File Here or Click";

  saveButton.innerText = "Update Document";
  cancelEditButton.style.display = "inline-block";

  titleInput.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  setTimeout(() => {
    titleInput.focus();
  }, 400);

  reportSuccess("Editing document. The edit form has been moved into view.");
}

/* ========= CANCEL EDIT ========= */
function cancelEdit() {
  editingDocId = null;
  resetForm();
  reportSuccess("Edit cancelled.");
}

/* ========= UPDATE DOCUMENT ========= */
async function updateDoc() {
  try {
    const title = titleInput.value.trim() || "Untitled Document";
    const text = document.getElementById("docInput").value;
    const file = selectedFile;
    const category = categoryInput.value || "General";

    if (!title && !text && !file) {
      throw new Error("Nothing to update");
    }

    if (!navigator.onLine) {
      showConnectionWarning("Your browser reports that you are offline.");
      throw new Error("Cannot update while offline. Updating requires internet.");
    }

    const { data: userData, error: userError } = await client.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("User session not found");
    }

    const docBeingEdited = allDocuments.find(doc => doc.id === editingDocId);

    const updateData = {
      title: title,
      content: text,
      category: category,
      updated_at: new Date().toISOString()
    };

    if (file) {
      const newFileUrl = await uploadSelectedFile(userData.user.id, file);

      if (docBeingEdited && docBeingEdited.file_url) {
        await deleteStorageFile(docBeingEdited.file_url);
      }

      updateData.file_url = newFileUrl;
    }

    const { error } = await client
      .from("documents")
      .update(updateData)
      .eq("id", editingDocId)
      .eq("user_id", userData.user.id);

    if (error) throw error;

    reportSuccess("Document updated successfully. Old file deleted if replaced.");

    editingDocId = null;
    resetForm();

    loadDocs();

  } catch (error) {
    reportError(error, "Updating Document");
  }
}

/* ========= RESET FORM ========= */
function resetForm() {
  titleInput.value = "";
  document.getElementById("docInput").value = "";
  categoryInput.value = "General";
  selectedFile = null;
  fileInput.value = "";
  dropZone.innerText = "Drag & Drop File Here or Click";

  saveButton.innerText = "Save Document";
  cancelEditButton.style.display = "none";
}

/* ========= LOAD DOCUMENTS ========= */
async function loadDocs() {
  try {
    const { data: userData, error: userError } = await client.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("User session not found");
    }

    const { data, error } = await client
      .from("documents")
      .select("*")
      .eq("user_id", userData.user.id)
      .order("id", { ascending: false });

    if (error) throw error;

    allDocuments = data || [];

    filterDocs();

  } catch (error) {
    reportError(error, "Loading Documents");
  }
}

/* ========= FILTER DOCUMENTS ========= */
function filterDocs() {
  const searchText = searchInput.value.trim().toLowerCase();
  const selectedCategory = categoryFilter.value;

  let filteredDocs = allDocuments;

  if (selectedCategory !== "All") {
    filteredDocs = filteredDocs.filter(doc => {
      return (doc.category || "General") === selectedCategory;
    });
  }

  if (searchText) {
    filteredDocs = filteredDocs.filter(doc => {
      const title = (doc.title || "Untitled Document").toLowerCase();
      const content = (doc.content || "").toLowerCase();
      const fileUrl = (doc.file_url || "").toLowerCase();
      const fileType = getFileTypeLabel(doc.file_url).toLowerCase();
      const createdAt = formatDate(doc.created_at).toLowerCase();
      const updatedAt = doc.updated_at ? formatDate(doc.updated_at).toLowerCase() : "";
      const category = (doc.category || "General").toLowerCase();

      return (
        title.includes(searchText) ||
        content.includes(searchText) ||
        fileUrl.includes(searchText) ||
        fileType.includes(searchText) ||
        createdAt.includes(searchText) ||
        updatedAt.includes(searchText) ||
        category.includes(searchText)
      );
    });
  }

  filteredDocs = sortDocuments(filteredDocs);

  updateDocCount(filteredDocs.length, allDocuments.length);

  renderDocs(filteredDocs);
}

/* ========= CLEAR FILTERS ========= */
function clearFilters() {
  searchInput.value = "";
  categoryFilter.value = "All";
  sortFilter.value = "newest";
  filterDocs();
  reportSuccess("Filters cleared.");
}

/* ========= DOCUMENT COUNT ========= */
function updateDocCount(visibleCount, totalCount) {
  if (totalCount === 0) {
    docCount.innerText = "No documents saved yet.";
    return;
  }

  if (visibleCount === totalCount) {
    docCount.innerText = "Showing " + totalCount + " of " + totalCount + " documents.";
    return;
  }

  docCount.innerText = "Showing " + visibleCount + " of " + totalCount + " documents.";
}

/* ========= EMPTY STATE ========= */
function getEmptyMessage() {
  if (allDocuments.length === 0) {
    return "No documents saved yet. Create your first document above.";
  }

  const hasSearch = searchInput.value.trim().length > 0;
  const hasCategoryFilter = categoryFilter.value !== "All";

  if (hasSearch || hasCategoryFilter) {
    return "No documents match your current search/filter.";
  }

  return "No documents to display.";
}

/* ========= EXPORT BACKUP ========= */
function exportBackup() {
  try {
    if (!allDocuments || allDocuments.length === 0) {
      throw new Error("No documents available to export.");
    }

    const backupData = {
      backup_type: "document-system-json-backup",
      exported_at: new Date().toISOString(),
      timezone_display: APP_TIMEZONE,
      total_documents: allDocuments.length,
      note: "This backup contains document records and file URLs only. It does not download the physical uploaded files.",
      documents: allDocuments.map(doc => ({
        id: doc.id,
        title: doc.title || "Untitled Document",
        content: doc.content || "",
        category: doc.category || "General",
        file_url: doc.file_url || null,
        file_type: getFileTypeLabel(doc.file_url),
        created_at: doc.created_at || null,
        created_display: doc.created_at ? formatDate(doc.created_at) : null,
        updated_at: doc.updated_at || null,
        updated_display: doc.updated_at ? formatDate(doc.updated_at) : null
      }))
    };

    const jsonText = JSON.stringify(backupData, null, 2);
    const blob = new Blob([jsonText], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const now = new Date();
    const safeDate = now.toISOString().replace(/[:.]/g, "-");
    const fileName = "document-system-backup-" + safeDate + ".json";

    const downloadLink = document.createElement("a");
    downloadLink.href = url;
    downloadLink.download = fileName;

    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);

    URL.revokeObjectURL(url);

    reportSuccess("Backup exported successfully. Remember: uploaded files themselves are not included, only file URLs.");

  } catch (error) {
    reportError(error, "Exporting Backup");
  }
}

/* ========= RENDER DOCUMENTS ========= */
function renderDocs(docs) {
  const container = document.getElementById("documents");
  container.innerHTML = "";

  if (!docs || docs.length === 0) {
    const empty = document.createElement("div");
    empty.className = "doc";
    empty.innerText = getEmptyMessage();
    container.appendChild(empty);
    return;
  }

  docs.forEach(doc => {
    const div = document.createElement("div");
    div.className = "doc";

    const title = document.createElement("div");
    title.innerText = doc.title || "Untitled Document";
    title.style.fontSize = "18px";
    title.style.fontWeight = "bold";
    title.style.marginBottom = "8px";

    div.appendChild(title);

    const category = document.createElement("div");
    category.innerText = "Category: " + (doc.category || "General");
    category.style.fontSize = "12px";
    category.style.color = "#00ff88";
    category.style.marginBottom = "6px";

    div.appendChild(category);

    const createdDate = document.createElement("div");
    createdDate.innerText = "Created: " + formatDate(doc.created_at);
    createdDate.style.fontSize = "12px";
    createdDate.style.color = "#aaa";
    createdDate.style.marginBottom = "6px";

    div.appendChild(createdDate);

    if (doc.updated_at) {
      const updatedDate = document.createElement("div");
      updatedDate.innerText = "Updated: " + formatDate(doc.updated_at);
      updatedDate.style.fontSize = "12px";
      updatedDate.style.color = "#aaa";
      updatedDate.style.marginBottom = "8px";

      div.appendChild(updatedDate);
    }

    const text = document.createElement("div");
    text.innerText = doc.content || "[No text content]";
    text.style.marginBottom = "8px";

    div.appendChild(text);

    if (doc.file_url) {
      const fileType = document.createElement("div");
      fileType.innerText = "Attached file type: " + getFileTypeLabel(doc.file_url);
      fileType.style.fontSize = "12px";
      fileType.style.color = "#aaa";
      fileType.style.marginTop = "8px";

      div.appendChild(fileType);

      if (isImageFile(doc.file_url)) {
        const preview = document.createElement("img");
        preview.src = doc.file_url;
        preview.alt = "Image preview";
        preview.style.display = "block";
        preview.style.maxWidth = "180px";
        preview.style.maxHeight = "180px";
        preview.style.objectFit = "cover";
        preview.style.marginTop = "10px";
        preview.style.borderRadius = "5px";
        preview.style.border = "1px solid #333";

        div.appendChild(preview);
      }

      const link = document.createElement("a");
      link.href = doc.file_url;
      link.target = "_blank";
      link.innerText = "Open File";

      div.appendChild(link);
    }

    const buttonRow = document.createElement("div");
    buttonRow.style.marginTop = "10px";

    const editBtn = document.createElement("button");
    editBtn.className = "secondary-button";
    editBtn.innerText = "Edit";
    editBtn.onclick = () => startEdit(doc.id, doc.title, doc.content, doc.category);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "danger-button";
    deleteBtn.innerText = "Delete";
    deleteBtn.onclick = () => confirmDeleteDoc(doc.id);

    buttonRow.appendChild(editBtn);
    buttonRow.appendChild(deleteBtn);

    div.appendChild(buttonRow);

    container.appendChild(div);
  });
}

/* ========= CONFIRM DELETE ========= */
function confirmDeleteDoc(id) {
  const confirmed = confirm("Are you sure you want to delete this document? If it has an uploaded file, the file will also be removed from storage. This cannot be undone.");

  if (!confirmed) {
    reportSuccess("Delete cancelled.");
    return;
  }

  deleteDoc(id);
}

/* ========= DELETE DOCUMENT ========= */
async function deleteDoc(id) {
  try {
    if (!navigator.onLine) {
      showConnectionWarning("Your browser reports that you are offline.");
      throw new Error("Cannot delete while offline. Deleting requires internet.");
    }

    const { data: userData, error: userError } = await client.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("User session not found");
    }

    const docToDelete = allDocuments.find(doc => doc.id === id);

    if (docToDelete && docToDelete.file_url) {
      await deleteStorageFile(docToDelete.file_url);
    }

    const { error } = await client
      .from("documents")
      .delete()
      .eq("id", id)
      .eq("user_id", userData.user.id);

    if (error) throw error;

    if (editingDocId === id) {
      editingDocId = null;
      resetForm();
    }

    reportSuccess("Document and attached file deleted if present.");

    loadDocs();

  } catch (error) {
    reportError(error, "Deleting Document");
  }
}

/* ========= ADMIN PANEL ========= */
function goToAdminPanel() {
  window.location.href = "admin-panel.html";
}

/* ========= LOGOUT ========= */
async function logout() {
  try {
    const { error } = await client.auth.signOut();

    if (error) throw error;

    reportSuccess("Logged out. Redirecting...");

    setTimeout(() => {
      window.location.href = "index.html";
    }, 800);

  } catch (error) {
    reportError(error, "Logout");
  }
}

/* ========= PWA SERVICE WORKER ========= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => {
        console.log("Service worker registered.");
      })
      .catch((error) => {
        console.error("Service worker registration failed:", error);
      });
  });
}

/* ========= INIT ========= */
checkBrowserNetworkStatus();
checkUser();
