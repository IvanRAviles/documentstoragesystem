<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Error Logs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e63946">

  <!-- Shared Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<div id="network-status"></div>

<h2>Admin Panel - Supabase Self-Snitch Logs</h2>

<div id="adminControls">
  <button onclick="loadLogs()">Refresh Logs</button>
  <button class="danger" onclick="clearLogs()">Clear Supabase Logs</button>
  <button class="secondary" onclick="goBack()">Back to Dashboard</button>
  <button class="secondary" onclick="logout()">Logout</button>
</div>

<div id="status">Checking session...</div>

<div id="logs"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const client = getSupabaseClient();

/* ========= STATUS ========= */
function setStatus(message) {
  document.getElementById("status").innerText = message;
}

/* ========= CONNECTION WARNING ========= */
function showConnectionWarning(reason) {
  const statusBox = document.getElementById("network-status");

  statusBox.style.display = "block";
  statusBox.innerText =
`OFFLINE / CONNECTION / SESSION ISSUE
------------------------
${reason}

This admin page may still load because of PWA caching, but verifying admin access, loading logs, clearing logs, and logging out require an active internet connection and a valid Supabase session.`;
}

function hideConnectionWarning() {
  const statusBox = document.getElementById("network-status");

  statusBox.style.display = "none";
  statusBox.innerText = "";
}

function checkBrowserNetworkStatus() {
  if (!navigator.onLine) {
    showConnectionWarning("Your browser reports that you are offline.");
  }
}

function isConnectionOrSessionIssue(error) {
  const message = (error.message || "").toLowerCase();

  return (
    message.includes("failed to fetch") ||
    message.includes("networkerror") ||
    message.includes("network request failed") ||
    message.includes("network") ||
    message.includes("fetch") ||
    message.includes("session") ||
    message.includes("not logged in") ||
    message.includes("auth") ||
    message.includes("supabase library is not loaded")
  );
}

function handleAdminError(error, context) {
  console.error(error);

  if (isConnectionOrSessionIssue(error)) {
    showConnectionWarning("The app could not confirm the Supabase connection/session. This often happens when internet is unavailable or the login session cannot be verified.");
  }

  let fixText = `
Possible Fix:
- Check login session
- Check Supabase setup
- Check internet
`;

  if (isConnectionOrSessionIssue(error)) {
    fixText = `
Possible Fix:
- Reconnect Wi-Fi / internet
- Refresh the page after reconnecting
- Log in again if the session expired
- Check if Supabase is reachable
`;
  }

  setStatus(
`ERROR DETECTED
------------------------
Where: ${context}
Message: ${error.message}
${fixText}`
  );
}

window.addEventListener("online", () => {
  hideConnectionWarning();
});

window.addEventListener("offline", () => {
  showConnectionWarning("Your browser reports that you are offline.");
});

/* ========= CHECK LOGIN + ADMIN ACCESS ========= */
async function checkUserAndAdmin() {
  try {
    checkBrowserNetworkStatus();

    const { data: userData, error: userError } = await client.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("User not logged in");
    }

    const userEmail = userData.user.email;

    const { data: adminData, error: adminError } = await client
      .from("admin_emails")
      .select("*")
      .eq("email", userEmail)
      .maybeSingle();

    if (adminError) {
      throw adminError;
    }

    if (!adminData) {
      setStatus(
`ACCESS DENIED
------------------------
This account is logged in, but it is not registered as an admin.

Logged-in email:
${userEmail}

Redirecting to dashboard...`
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 2500);

      return;
    }

    hideConnectionWarning();

    document.getElementById("adminControls").style.display = "block";

    setStatus("Admin verified. Loading Supabase logs...");

    loadLogs();

  } catch (error) {
    handleAdminError(error, "Admin Access Check");
  }
}

/* ========= LOAD SUPABASE ERROR LOGS ========= */
async function loadLogs() {
  const logsContainer = document.getElementById("logs");

  try {
    checkBrowserNetworkStatus();

    const { data: userData, error: userError } = await client.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("User session not found");
    }

    const { data, error } = await client
      .from("error_logs")
      .select("*")
      .eq("user_id", userData.user.id)
      .order("id", { ascending: false });

    if (error) throw error;

    hideConnectionWarning();

    logsContainer.innerHTML = "";

    if (!data || data.length === 0) {
      setStatus("Total Supabase logs: 0");

      logsContainer.innerHTML = `
        <div class="empty">
          No Supabase error logs found.
        </div>
      `;

      return;
    }

    setStatus("Total Supabase logs: " + data.length);

    data.forEach((log) => {
      const div = document.createElement("div");
      div.className = "log";

      div.innerText =
`LOG #${log.id}
------------------------
Time: ${log.created_at || "No time recorded"}
Context: ${log.context || "No context recorded"}
Message: ${log.message || "No message recorded"}
Source: ${log.source || "No source recorded"}
Line: ${log.line_number || "N/A"}
Column: ${log.column_number || "N/A"}`;

      logsContainer.appendChild(div);
    });

  } catch (error) {
    handleAdminError(error, "Loading Supabase Logs");
  }
}

/* ========= CLEAR SUPABASE ERROR LOGS ========= */
async function clearLogs() {
  const confirmed = confirm("Are you sure you want to clear your Supabase error logs?");

  if (!confirmed) {
    return;
  }

  try {
    checkBrowserNetworkStatus();

    if (!navigator.onLine) {
      throw new Error("Cannot clear logs while offline. Clearing logs requires internet.");
    }

    const { data: userData, error: userError } = await client.auth.getUser();

    if (userError || !userData.user) {
      throw new Error("User session not found");
    }

    const { error } = await client
      .from("error_logs")
      .delete()
      .eq("user_id", userData.user.id);

    if (error) throw error;

    hideConnectionWarning();

    setStatus("Supabase logs cleared.");

    loadLogs();

  } catch (error) {
    handleAdminError(error, "Clearing Supabase Logs");
  }
}

/* ========= GO BACK ========= */
function goBack() {
  window.location.href = "dashboard.html";
}

/* ========= LOGOUT ========= */
async function logout() {
  try {
    checkBrowserNetworkStatus();

    const { error } = await client.auth.signOut();

    if (error) throw error;

    hideConnectionWarning();

    setStatus("Logged out. Redirecting...");

    setTimeout(() => {
      window.location.href = "index.html";
    }, 800);

  } catch (error) {
    handleAdminError(error, "Logout");
  }
}

/* ========= PWA SERVICE WORKER ========= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => {
        console.log("Service worker registered.");
      })
      .catch((error) => {
        console.error("Service worker registration failed:", error);
      });
  });
}

/* ========= INIT ========= */
checkBrowserNetworkStatus();
checkUserAndAdmin();
</script>

</body>
</html>
